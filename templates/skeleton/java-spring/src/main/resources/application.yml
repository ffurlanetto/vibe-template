# @@PROJECT@@ — application configuration.
# Every value that differs per environment comes from an environment variable,
# never from a committed literal (AGENTS.md A5).

spring:
  application:
    name: ${APP_NAME:@@PROJECT_KEBAB@@}

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: ${LOG_LEVEL:info}

management:
  endpoints:
    web:
      exposure:
        # Health lives at /health/live and /health/ready (SPEC-001); Actuator
        # stays available for metrics only.
        include: metrics,prometheus

# @@PROJECT@@ — Quarkus configuration.
# Values that differ per environment come from the environment (AGENTS.md A5).
quarkus.application.name=${APP_NAME:@@PROJECT_KEBAB@@}
quarkus.http.port=${PORT:8080}
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.console.json=true
# Never return a stack trace to a client (A5).
quarkus.http.body.handle-file-uploads=false

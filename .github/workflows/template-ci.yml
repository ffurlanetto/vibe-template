name: Template CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Template quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Validates JSON, skill and agent frontmatter, hook wiring and the
      # generated opencode artifacts, then runs the hook and init.sh test suites.
      - name: make check
        run: make check

  bootstrap:
    name: bootstrap ${{ matrix.stack }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: python-fastapi
            setup: python
          - stack: go
            setup: go
          - stack: nestjs
            setup: node
          - stack: frontend
            setup: node
          - stack: java-spring
            setup: java
          - stack: java-spring-gradle
            setup: java
          - stack: java-quarkus
            setup: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.setup == 'python'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
        if: matrix.setup == 'python'

      - uses: actions/setup-go@v5
        if: matrix.setup == 'go'
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        if: matrix.setup == 'node'
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        if: matrix.setup == 'java'
        with:
          distribution: temurin
          java-version: '21'

      - name: Bootstrap a project
        run: ./init.sh demo-${{ matrix.stack }} ${{ matrix.stack }} "$RUNNER_TEMP/demo" --yes

      # The acceptance criterion for a tier A stack: the gate is green on the
      # freshly generated project, with no manual step in between.
      - name: The generated project's own quality gate
        working-directory: ${{ runner.temp }}/demo
        run: make install && make check

  structure:
    name: bootstrap ${{ matrix.stack }} (structure only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        stack: [dotnet-aspnet, rust, rails, react-native, flutter, monorepo, sre]
    steps:
      - uses: actions/checkout@v4

      # Tier B: no toolchain is installed, so layer 1 is skipped on purpose.
      # What must hold is that the layout, the Makefile and the agent
      # configuration are produced anyway.
      - name: Bootstrap without a toolchain
        run: ./init.sh demo-${{ matrix.stack }} ${{ matrix.stack }} "$RUNNER_TEMP/demo" --scaffold structure --yes

      - name: The contract is in place
        working-directory: ${{ runner.temp }}/demo
        run: |
          test -f Makefile
          test -f AGENTS.md
          test -f .claude/skills/plan/SKILL.md
          test -f .opencode/agents/architect.md
          make help

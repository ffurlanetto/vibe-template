name: Quality Gate

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

# ── GITHUB ACTIONS SECURITY ──────────────────────────────────────────────────
# Never interpolate ${{ github.event.* }} directly inside a `run:` block: a PR
# title or a commit message an attacker controls becomes shell input.
#
# ✅ pass it through the environment       ❌ interpolate it into the script
#   env:                                     run: echo "${{ github.event.pull_request.title }}"
#     PR_TITLE: ${{ github.event.pull_request.title }}
#   run: echo "$PR_TITLE"
#
# High-risk inputs: issue.title/body, pull_request.title/body, comment.body,
# head_commit.message, head_ref, client_payload.*
# ──────────────────────────────────────────────────────────────────────────────

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ── Install the toolchain for your stack (see AGENTS.md B2) ──
      # Uncomment the block that matches; pin every action outside actions/ by SHA (A13).
      #
      # - uses: actions/setup-python@v5
      #   with: { python-version: '3.12' }
      # - uses: astral-sh/setup-uv@v4
      #
      # - uses: actions/setup-node@v4
      #   with: { node-version: '22', cache: 'npm' }
      #
      # - uses: actions/setup-go@v5
      #   with: { go-version: '1.23', cache: true }
      #
      # - uses: actions/setup-java@v4
      #   with: { distribution: 'temurin', java-version: '21', cache: 'maven' }
      #
      # - uses: actions/setup-dotnet@v4
      #   with: { dotnet-version: '8.0.x' }

      - name: Install dependencies
        run: make install

      # One target, every stack: the Makefile holds the stack-specific commands
      # (AGENTS.md B4), so this pipeline never needs to know the language.
      - name: Quality gate
        run: make check

  guardrails:
    name: Security guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan sees more than the tip commit.
          fetch-depth: 0

      - name: Hook self-test
        run: make test-hooks

      - name: Generated agent artifacts are up to date
        run: make check-sync

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
